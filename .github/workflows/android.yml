name: Android Build (Mystery of Limbo)

on:
  push:
    branches: 
      - "ShadowRoot-*"
      - "feat/VectorZero_gameExample" # <<-- Activador para tu rama de desarrollo actual
  pull_request:
    branches: 
      - "ShadowRoot-*"
      - "feat/VectorZero_gameExample"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Entorno
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar NDK y Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip unzip

      - name: Compilar C++ a Binario Android
        run: |
          mkdir -p build_android
          cd build_android
          for ABI in armeabi-v7a arm64-v8a; do
            mkdir -p $ABI
            cd $ABI
            cmake ../.. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -GNinja
            ninja
            cd ..
          done

      - name: Generar APK - Estrategia Quirúrgica
        run: |
          export TOOL_PATH=$ANDROID_HOME/build-tools/34.0.0
          export PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar

          # --- PASO 1: LIMPIEZA Y CONFIGURACIÓN ---
          rm -rf java_src obj dex_out sdl_temp
          mkdir -p java_src/com/shadowroot/mysteryoflimbo obj dex_out bin

          echo "📥 Clonando SDL release-2.30.2 para sincronizar con la capa Java..."
          git clone --branch release-2.30.2 --depth 1 https://github.com/libsdl-org/SDL.git sdl_temp

          # --- PASO 2: RECOLECCIÓN DEL FRAMEWORK JAVA DE SDL ---
          mkdir -p java_src/org/libsdl/app
          find sdl_temp -name "*.java" -exec grep -l "package org.libsdl.app" {} + | xargs -I {} cp {} java_src/org/libsdl/app/

          # Inyectar tu actividad personalizada
          cp android/app/src/main/java/com/shadowroot/mysteryoflimbo/MysteryOfLimboActivity.java java_src/com/shadowroot/mysteryoflimbo/

          # --- PASO 3: COMPILACIÓN DEL CÓDIGO JAVA ---
          find java_src -name "*.java" > java_files.txt
          echo "✅ Iniciando javac con los archivos Java del motor..."
          javac -d obj -cp $PLATFORM @java_files.txt || (echo "❌ ERROR: Falló javac" && exit 1)

          # --- PASO 4: PROCESAMIENTO DEX ---
          find obj -name "*.class" > class_files.txt
          $TOOL_PATH/d8 --output dex_out/ --lib $PLATFORM --min-api 26 @class_files.txt
          echo "✅ Proceso DEX completado de forma exitosa."

          # --- PASO 5: ENSAMBLAJE DEL APK BASE ---
          # Se genera directamente con el nombre solicitado: game_file.apk
          $TOOL_PATH/aapt package -f -M android/app/src/main/AndroidManifest.xml \
            -I $PLATFORM \
            -F bin/game_file.apk

          # Inyectar archivo ejecutable Dalvik (DEX)
          cd dex_out && zip -ur9 ../bin/game_file.apk classes.dex && cd ..

          # --- PASO 6: RECOLECCIÓN INDUSTRIAL DE LIBRERÍAS (.SO) ---
          mkdir -p lib/armeabi-v7a lib/arm64-v8a

          echo "🔍 Extrayendo binarios compilados de la arquitectura armeabi-v7a..."
          cp build_android/armeabi-v7a/libmain.so lib/armeabi-v7a/
          find build_android/armeabi-v7a -name "*.so" -exec cp {} lib/armeabi-v7a/ \;

          echo "🔍 Extrayendo binarios compilados de la arquitectura arm64-v8a..."
          cp build_android/arm64-v8a/libmain.so lib/arm64-v8a/
          find build_android/arm64-v8a -name "*.so" -exec cp {} lib/arm64-v8a/ \;

          # Inyectar bibliotecas nativas compartidas con CERO COMPRESIÓN (-0)
          zip -ur0 bin/game_file.apk lib/

          # --- PASO 7: AGREGAR RECURSOS MULTIMEDIA (ASSETS) ---
          if [ -d "assets" ]; then
            echo "📦 Inyectando assets de juego (Mapas JSON, texturas, fuentes) con CERO COMPRESIÓN..."
            zip -ur0 bin/game_file.apk assets/
          fi

          # --- PASO 8: ALINEACIÓN REPARADA (ZIPALIGN) ---
          echo "⚖️ Optimizando alineación de memoria a 4 bytes..."
          $TOOL_PATH/zipalign -f -p 4 bin/game_file.apk bin/game_file_aligned.apk
          mv bin/game_file_aligned.apk bin/game_file.apk
          echo "🚀 APK final generada listo para pruebas en bin/game_file.apk"

      - name: Guardar y Sincronizar Cambios con el Repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "ShadowRoot07"
          git config --global user.email "shadowroot07@users.noreply.github.com"

          git fetch origin ${{ github.ref_name }}
          git add bin/game_file.apk

          if git diff --staged --quiet; then
            echo "No se detectaron cambios binarios nuevos en el APK."
          else
            git commit -m "chore: automated cloud build update - game_file.apk [skip ci]"
            git push --force origin HEAD:${{ github.ref_name }}
          fi

